appId: com.aoiro-shinkoku.app
productName: AoiroShinkoku
publish:
  provider: github
  owner: SouY4
  repo: aoiro-shinkoku
directories:
  output: dist
  buildResources: build
files:
  - electron/**/*
  - "!next-app"
extraResources:
  - from: next-app
    to: app
    filter:
      - "**/*"
compression: store
afterPack: scripts/after-pack.js
win:
  artifactName: AoiroShinkoku-Setup.exe
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - ja
mac:
  artifactName: AoiroShinkoku-${arch}.dmg
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  artifactName: AoiroShinkoku.AppImage
  target:
    - target: AppImage
      arch:
        - x64
